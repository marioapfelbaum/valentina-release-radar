name: Deploy on Push

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
      - 'release_radar.html'
      - 'event_radar.html'
      - 'network_explorer.html'
      - 'network_artists.json'
      - 'favorites.json'
      - 'functions/**'
      - 'deploy.sh'
      - 'wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh
