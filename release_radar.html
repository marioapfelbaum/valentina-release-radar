<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo, useLayoutEffect } = React;

// --- MOBILE DETECTION ---
function useIsMobile(breakpoint = 640) {
  const [mobile, setMobile] = useState(window.innerWidth < breakpoint);
  useEffect(() => {
    const handler = () => setMobile(window.innerWidth < breakpoint);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, [breakpoint]);
  return mobile;
}

// --- PALETTE ---
const C = {
  bg:"#d8809a", bgDeep:"#c46e88", bgLight:"#e094aa",
  orange:"#d4915e", mauve:"#8a7a9e", olive:"#7a8a5c",
  white:"#fff", hi:"rgba(255,255,255,0.95)", mid:"rgba(255,255,255,0.8)",
  soft:"rgba(255,255,255,0.55)", ghost:"rgba(255,255,255,0.3)",
  heard:"rgba(255,255,255,0.2)", reissue:"#e8a96a",
};
const F = "'Barlow Condensed','Arial Narrow',sans-serif";
const GC = {"All":"#fff","Minimal House":"#d4915e","Microhouse":"#8a7a9e","Rominimal":"#7a8a5c","Dub Techno":"#9a7a8a","Deep House":"#c46e88","Techno":"#b0607a","Ambient":"#8aaa7c","Electro":"#aa8a5e","Acid":"#c4a060","House":"#d4915e"};

// --- MOCK DATA (used if releases.json not found) ---
const MOCK = [
  {id:"1",title:"Nebula Transit",artist:"Leafar Legov",album:"Negative Space EP",label:"Giegling",duration:"7:42",date:"2026-02-10",re:false,genre:"Minimal House",source:"Discogs",format:"EP"},
  {id:"2",title:"Dust Settles",artist:"Binh",album:"Dust Settles",label:"Perlon",duration:"8:15",date:"2026-02-08",re:false,genre:"Microhouse",source:"Discogs",format:"Single"},
  {id:"3",title:"Desolé",artist:"Sonja Moonear",album:"Desert Quarters Remixed",label:"Ruta 5",duration:"6:58",date:"2026-02-07",re:true,genre:"Minimal House",source:"MusicBrainz",format:"EP"},
  {id:"4",title:"Pattern 13 (2026 Remaster)",artist:"Roman Flügel",album:"Tracks On Delivery Vol. 4",label:"Ongaku Musik",duration:"9:03",date:"2026-02-06",re:true,genre:"Microhouse",source:"Discogs",format:"LP"},
  {id:"5",title:"Formanta",artist:"Rhadoo",album:"Formanta EP",label:"[a:rpia:r]",duration:"10:22",date:"2026-02-05",re:false,genre:"Rominimal",source:"Discogs",format:"EP"},
  {id:"6",title:"Blue Channel",artist:"Vril",album:"Anima Mundi",label:"Delsin",duration:"6:11",date:"2026-02-04",re:false,genre:"Dub Techno",source:"MusicBrainz",format:"LP"},
  {id:"7",title:"Nocturne III",artist:"Vlad Caia",album:"Nocturne III",label:"Amphia",duration:"8:44",date:"2026-02-03",re:false,genre:"Rominimal",source:"Discogs",format:"Single"},
  {id:"8",title:"Zephyr",artist:"Priku",album:"Zephyr EP",label:"Metereze",duration:"7:30",date:"2026-02-02",re:false,genre:"Rominimal",source:"Discogs",format:"EP"},
  {id:"9",title:"No Day (2026 Repress)",artist:"Baby Ford",album:"No Day",label:"Perlon",duration:"7:18",date:"2026-02-01",re:true,genre:"Minimal House",source:"Discogs",format:"Single"},
  {id:"10",title:"Theorem",artist:"Nicolas Lutz",album:"My Own Jupiter 012",label:"My Own Jupiter",duration:"8:55",date:"2026-01-30",re:false,genre:"Minimal House",source:"MusicBrainz",format:"EP"},
  {id:"11",title:"Acid Garden",artist:"Margaret Dygas",album:"Acid Garden EP",label:"Perlon",duration:"6:45",date:"2026-01-28",re:false,genre:"Microhouse",source:"Discogs",format:"EP"},
  {id:"12",title:"Fata Morgana",artist:"Barac",album:"Hergang 009",label:"Hergang",duration:"9:12",date:"2026-01-25",re:false,genre:"Rominimal",source:"Discogs",format:"EP"},
  {id:"13",title:"Depth Charge",artist:"Traumprinz",album:"Depth Charge",label:"Giegling",duration:"11:30",date:"2026-01-22",re:false,genre:"Deep House",source:"MusicBrainz",format:"LP"},
  {id:"14",title:"Mist",artist:"Edward",album:"Shtum 018",label:"Shtum",duration:"7:02",date:"2026-01-20",re:false,genre:"Minimal House",source:"Discogs",format:"Single"},
  {id:"15",title:"Sunwave 26",artist:"Zip",album:"Sunwave 26",label:"Perlon",duration:"8:33",date:"2026-01-18",re:false,genre:"Microhouse",source:"Discogs",format:"EP"},
];

// --- STORAGE (localStorage for standalone HTML) ---
const store = {
  get: (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// --- COPY BUTTON ---
function Cp({text, label}) {
  const [ok, set] = useState(false);
  return (
    <button className="copy-btn" onClick={e => { e.stopPropagation(); navigator.clipboard.writeText(text); set(true); setTimeout(() => set(false), 1200); }}
      style={{background:ok?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.06)",border:"none",padding:"4px 10px",cursor:"pointer",
      display:"inline-flex",alignItems:"center",gap:"5px",fontSize:"24px",fontFamily:F,fontWeight:700,
      color:ok?"#fff":C.soft,letterSpacing:"0.06em",textTransform:"uppercase",transition:"all 0.15s"}}>
      {ok ? <>✓ OK</> : <>⎘ {label}</>}
    </button>
  );
}

// --- LINK PANEL (with availability check via proxy) ---
const LINK_PROXY = "http://localhost:8081";
const ALL_SHOPS = [
  {name:"Bandcamp",urlFn:(q,t)=>`https://bandcamp.com/search?q=${q}`,color:"rgba(99,210,218,0.85)",group:"buy"},
  {name:"Beatport",urlFn:(q,t)=>`https://www.beatport.com/search?q=${encodeURIComponent(t.artist+' '+t.title)}`,color:"rgba(148,232,116,0.85)",group:"buy"},
  {name:"Juno",urlFn:(q,t)=>`https://www.juno.co.uk/search/?q%5Ball%5D%5B%5D=${q}`,color:"rgba(255,200,80,0.85)",group:"buy"},
  {name:"Discogs MP",urlFn:(q,t)=>`https://www.discogs.com/search/?q=${q}&type=release`,color:"rgba(255,180,60,0.85)",group:"buy"},
  {name:"Deejay.de",urlFn:(q,t)=>`https://www.deejay.de/search?q=${q}`,color:"rgba(200,160,255,0.85)",group:"buy"},
  {name:"Spotify",urlFn:(q,t)=>`https://open.spotify.com/search/${encodeURIComponent(t.artist+' '+t.title)}`,color:"rgba(30,215,96,0.8)",group:"listen"},
  {name:"SoundCloud",urlFn:(q,t)=>`https://soundcloud.com/search?q=${q}`,color:"rgba(255,136,0,0.8)",group:"listen"},
  {name:"YouTube",urlFn:(q,t)=>`https://www.youtube.com/results?search_query=${q}`,color:"rgba(255,80,80,0.8)",group:"listen"},
];

// Cache checked results globally so we don't re-check
const _linkCache = {};
// Cache YouTube-search results so wir nicht bei jedem Re-Render erneut suchen
const _ytCache = {};
// Cache Bandcamp resolve results (album-IDs sind stabil)
const _bcCache = {};
// Cache SoundCloud results
const _scCache = {};

// --- INLINE PLAYER ---
// Player-Priority gemaess User-Wunsch ("Player muss von der Source-Seite kommen"):
//   1. Bandcamp (wenn source=bandcamp oder source_urls.bandcamp existiert) — voller Album-Player
//   2. Spotify (wenn Spotify-URL vorhanden) — Album-Embed
//   3. YouTube (Fallback fuer Hardwax/Redeye/Clone/etc. — diese Shops haben keinen iframe-Player)
// Bandcamp braucht Album-ID-Lookup via Pages Function /api/bandcamp-resolve (CORS-Bypass).
function InlinePlayer({t, onClose}) {
  const [ytId, setYtId] = useState(_ytCache[`${t.artist}|${t.title}`] || null);
  const [searchingYt, setSearchingYt] = useState(false);
  const [bcResolved, setBcResolved] = useState(_bcCache[t.id] !== undefined ? _bcCache[t.id] : null);
  const [resolvingBc, setResolvingBc] = useState(false);

  const bandcampUrl = useMemo(() => {
    if (t.source === "bandcamp" && t.source_url) return t.source_url;
    if (t.source_urls && t.source_urls.bandcamp) return t.source_urls.bandcamp;
    return null;
  }, [t]);

  const spotifyId = useMemo(() => {
    const url = (t.source_urls && t.source_urls.spotify) || (t.source === "spotify" && t.source_url) || "";
    const m = url.match(/spotify\.com\/album\/([a-zA-Z0-9]+)/);
    return m ? m[1] : null;
  }, [t]);

  // Bandcamp Lookup: erst URL-Resolve, bei Fehler (404 / falsches Label) auf Search fallen.
  // Beispiel "Blaze / 20 20 Vision Remixes": Datensatz hat slipnslide.bandcamp.com (falsch),
  // korrekt ist b-l-a-z-e.bandcamp.com — Search findet die richtige URL.
  useEffect(() => {
    if (_bcCache[t.id] !== undefined) { setBcResolved(_bcCache[t.id]); return; }
    let cancelled = false;
    setResolvingBc(true);
    (async () => {
      const q = encodeURIComponent(`${t.artist} ${t.title}`);
      const labelParam = t.label ? `&label=${encodeURIComponent(t.label)}` : '';
      const searchUrl = `/api/bandcamp-search?q=${q}${labelParam}`;
      try {
        let data = null;
        // Schritt 1: Bei bekannter URL erst Resolve versuchen
        if (bandcampUrl) {
          const r = await fetch(`/api/bandcamp-resolve?url=${encodeURIComponent(bandcampUrl)}`);
          if (r.ok) data = await r.json();
        }
        // Schritt 2: Wenn Resolve nichts brachte (URL falsch/veraltet) → Search-Fallback
        if (!data || (!data.album_id && !data.track_id)) {
          const r = await fetch(searchUrl);
          if (r.ok) data = await r.json();
        }
        if (data && (data.album_id || data.track_id)) {
          _bcCache[t.id] = data;
          if (!cancelled) { setBcResolved(data); setResolvingBc(false); }
        } else {
          _bcCache[t.id] = "failed";
          if (!cancelled) { setBcResolved("failed"); setResolvingBc(false); }
        }
      } catch {
        _bcCache[t.id] = "failed";
        if (!cancelled) { setBcResolved("failed"); setResolvingBc(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [t.id, bandcampUrl, t.artist, t.title, t.label]);

  // SoundCloud-Lookup nur wenn Bandcamp gescheitert UND kein Spotify (3rd Fallback)
  const [scResolved, setScResolved] = useState(_scCache[t.id] !== undefined ? _scCache[t.id] : null);
  const [resolvingSc, setResolvingSc] = useState(false);
  const tryScNow = bcResolved === "failed" && !spotifyId;
  useEffect(() => {
    if (!tryScNow) return;
    if (_scCache[t.id] !== undefined) { setScResolved(_scCache[t.id]); return; }
    let cancelled = false;
    setResolvingSc(true);
    (async () => {
      try {
        const q = encodeURIComponent(`${t.artist} ${t.title}`);
        const r = await fetch(`/api/soundcloud-search?q=${q}`);
        if (r.ok) {
          const data = await r.json();
          _scCache[t.id] = data;
          if (!cancelled) { setScResolved(data); setResolvingSc(false); }
        } else {
          _scCache[t.id] = "failed";
          if (!cancelled) { setScResolved("failed"); setResolvingSc(false); }
        }
      } catch {
        _scCache[t.id] = "failed";
        if (!cancelled) { setScResolved("failed"); setResolvingSc(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [t.id, t.artist, t.title, tryScNow]);

  // Player-Hierarchie: Bandcamp > Spotify > SoundCloud > YouTube (allerletzter Fallback)
  const bcOk = bcResolved && bcResolved !== "failed" && (bcResolved.album_id || bcResolved.track_id);
  const scOk = scResolved && scResolved !== "failed" && scResolved.embed_url;
  const bcDone = !resolvingBc && bcResolved !== null;
  const scDone = !resolvingSc && scResolved !== null;
  // YouTube nur wenn Bandcamp+SoundCloud beide fertig probiert UND nichts gefunden UND kein Spotify
  const needsYoutube = bcDone && !bcOk && !spotifyId && scDone && !scOk;
  useEffect(() => {
    if (!needsYoutube) return;
    const cacheKey = `${t.artist}|${t.title}`;
    if (_ytCache[cacheKey]) { setYtId(_ytCache[cacheKey]); return; }
    let cancelled = false;
    setSearchingYt(true);
    (async () => {
      const instances = ['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.yt'];
      for (const base of instances) {
        try {
          const resp = await fetch(`${base}/search?q=${encodeURIComponent(t.artist + ' ' + t.title)}&filter=videos`);
          if (!resp.ok) continue;
          const data = await resp.json();
          const items = data.items || data;
          if (items && items.length > 0) {
            const url = items[0].url || '';
            const match = url.match(/[?&]v=([^&]+)/) || url.match(/\/([^/]+)$/);
            if (match) {
              const id = match[1];
              _ytCache[cacheKey] = id;
              if (!cancelled) { setYtId(id); setSearchingYt(false); }
              return;
            }
          }
        } catch {}
      }
      if (!cancelled) setSearchingYt(false);
    })();
    return () => { cancelled = true; };
  }, [t.id, t.artist, t.title, needsYoutube]);

  // Bandcamp embed URL
  const bcEmbedUrl = bcOk
    ? `https://bandcamp.com/EmbeddedPlayer/${bcResolved.album_id ? "album=" + bcResolved.album_id : "track=" + bcResolved.track_id}/size=large/bgcol=181a1b/linkcol=d4915e/tracklist=true/artwork=small/transparent=true/`
    : null;

  const noPlayerAtAll = bcDone && !bcOk && !spotifyId && scDone && !scOk && !ytId && !searchingYt;
  const label = resolvingBc ? "↻ BANDCAMP-SUCHE..."
    : bcOk ? "▶ BANDCAMP"
    : spotifyId ? "▶ SPOTIFY"
    : resolvingSc ? "↻ SOUNDCLOUD-SUCHE..."
    : scOk ? "▶ SOUNDCLOUD"
    : searchingYt ? "↻ YOUTUBE-SUCHE..."
    : ytId ? "▶ YOUTUBE (letzter Fallback)"
    : noPlayerAtAll ? "● VINYL ONLY — nicht digital verfuegbar"
    : "↻ SUCHE...";

  return (
    <div style={{padding:"12px 0 14px 124px",borderTop:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.18)"}}
      onClick={e => e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px",paddingRight:"20px"}}>
        <span style={{fontFamily:F,fontWeight:700,fontSize:"13px",color:C.ghost,letterSpacing:"0.08em",textTransform:"uppercase"}}>
          {label}
        </span>
        <span onClick={onClose} style={{cursor:"pointer",color:C.ghost,fontSize:"22px",padding:"0 6px",userSelect:"none"}} title="Player schliessen">×</span>
      </div>
      {bcOk && (
        <iframe style={{borderRadius:"4px",border:"none",width:"100%",maxWidth:"720px",height:"340px"}}
          src={bcEmbedUrl}
          allow="autoplay; clipboard-write; encrypted-media" loading="lazy"/>
      )}
      {!bcOk && !resolvingBc && spotifyId && (
        <iframe style={{borderRadius:"4px",border:"none",width:"100%",maxWidth:"720px",height:"152px"}}
          src={`https://open.spotify.com/embed/album/${spotifyId}?utm_source=valentina`}
          allow="autoplay; clipboard-write; encrypted-media; picture-in-picture" loading="lazy"/>
      )}
      {!bcOk && !resolvingBc && !spotifyId && scOk && (
        <iframe style={{borderRadius:"4px",border:"none",width:"100%",maxWidth:"720px",height:"166px"}}
          src={scResolved.embed_url}
          allow="autoplay" loading="lazy"/>
      )}
      {needsYoutube && ytId && (
        <iframe style={{borderRadius:"4px",border:"none",width:"100%",maxWidth:"640px",height:"360px"}}
          src={`https://www.youtube.com/embed/${ytId}?autoplay=1`}
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowFullScreen/>
      )}
      {noPlayerAtAll && (() => {
        const q = encodeURIComponent(`${t.artist} ${t.title}`);
        const lnk = (href, color, txt) => (
          <a href={href} target="_blank" rel="noopener noreferrer"
            style={{color,textDecoration:"none",padding:"4px 9px",background:"rgba(0,0,0,0.25)",
              fontFamily:F,fontWeight:700,fontSize:"13px",letterSpacing:"0.05em",textTransform:"uppercase"}}>{txt}</a>
        );
        return (
          <div style={{padding:"4px 0 0 0"}}>
            <div style={{fontFamily:F,fontSize:"13px",color:"rgba(255,180,80,0.9)",marginBottom:"8px",letterSpacing:"0.05em"}}>
              Kein digitaler Player — Release ist vermutlich Vinyl-Only oder digital nicht freigegeben.
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"6px",alignItems:"center"}}>
              <span style={{fontFamily:F,fontWeight:700,fontSize:"12px",color:C.soft,letterSpacing:"0.08em",textTransform:"uppercase",marginRight:"4px"}}>Vinyl shops:</span>
              {lnk(`https://www.juno.co.uk/search/?q%5Ball%5D%5B%5D=${q}`, "rgba(255,200,80,0.9)", "Juno")}
              {lnk(`https://www.deejay.de/search?q=${q}`, "rgba(200,160,255,0.9)", "Deejay.de")}
              {lnk(`https://www.discogs.com/sell/list?q=${q}`, "rgba(255,180,60,0.9)", "Discogs MP")}
              {lnk(`https://www.decks.de/decks/workfloor/lists/list_search.php?searchstring=${q}`, "rgba(180,200,255,0.85)", "Decks.de")}
              {lnk(`https://hardwax.com/?search=${q}`, "rgba(120,220,180,0.85)", "Hardwax")}
              {bandcampUrl && lnk(bandcampUrl, "rgba(99,210,218,0.9)", "Bandcamp ↗")}
              {t.source_url && lnk(t.source_url, C.soft, `${t.source} ↗`)}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"6px",alignItems:"center",marginTop:"6px"}}>
              <span style={{fontFamily:F,fontWeight:700,fontSize:"12px",color:C.soft,letterSpacing:"0.08em",textTransform:"uppercase",marginRight:"4px"}}>Suche:</span>
              {lnk(`https://www.youtube.com/results?search_query=${q}`, "rgba(255,80,80,0.85)", "YouTube")}
              {lnk(`https://soundcloud.com/search?q=${q}`, "rgba(255,136,0,0.85)", "SoundCloud")}
              {lnk(`https://www.google.com/search?q=${q}`, "rgba(255,255,255,0.5)", "Google")}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function LinkPanel({t, q, mobile}) {
  const [status, setStatus] = useState({}); // {name: true|false|"checking"}
  const [proxyOk, setProxyOk] = useState(null); // null=unknown, true/false
  const cacheKey = `${t.artist}|${t.title}`;

  useEffect(() => {
    // If cached, use immediately
    if (_linkCache[cacheKey]) {
      setStatus(_linkCache[cacheKey]);
      return;
    }

    let cancelled = false;

    (async () => {
      // Build URLs for all shops
      const shops = ALL_SHOPS.map(s => ({...s, url: s.urlFn(q, t)}));

      // Try batch endpoint first
      const init = {};
      shops.forEach(s => { init[s.name] = "checking"; });
      setStatus(init);

      try {
        const batchUrl = `${LINK_PROXY}/batch?` + shops.map(s => `urls=${encodeURIComponent(s.url)}`).join("&");
        const res = await fetch(batchUrl, {signal: AbortSignal.timeout(15000)});
        if (!res.ok) throw new Error("proxy error");
        const data = await res.json();
        if (cancelled) return;
        setProxyOk(true);

        const result = {};
        shops.forEach(s => {
          result[s.name] = data[s.url] === true;
        });
        _linkCache[cacheKey] = result;
        setStatus(result);
      } catch {
        // Proxy not available — show all links as fallback
        if (cancelled) return;
        setProxyOk(false);
        const fallback = {};
        shops.forEach(s => { fallback[s.name] = true; });
        _linkCache[cacheKey] = fallback;
        setStatus(fallback);
      }
    })();

    return () => { cancelled = true; };
  }, [cacheKey, q, t]);

  const shops = ALL_SHOPS.map(s => ({...s, url: s.urlFn(q, t)}));
  const checking = Object.values(status).some(v => v === "checking");
  const buyLinks = shops.filter(s => s.group === "buy" && status[s.name] === true);
  const listenLinks = shops.filter(s => s.group === "listen" && status[s.name] === true);

  const SC = {"discogs":"rgba(255,180,60,0.7)","beatport":"rgba(148,232,116,0.85)","bandcamp":"rgba(99,210,218,0.85)","spotify":"rgba(30,215,96,0.8)","musicbrainz":"rgba(120,180,120,0.7)"};
  const srcKey = (t.source||"").toLowerCase();
  const srcColor = SC[srcKey] || "rgba(255,255,255,0.4)";
  const fmtLabel = t.format === "LP" ? "LP" : t.format === "EP" ? "EP" : t.format === "Single" ? "SGL" : "";

  const lkSz = mobile ? "13px" : "16px";
  const lkPad = mobile ? "3px 7px" : "4px 10px";
  const linkStyle = s => ({fontFamily:F,fontWeight:700,fontSize:lkSz,color:s.color,textDecoration:"none",
    padding:lkPad,background:"rgba(0,0,0,0.2)",transition:"all 0.12s",letterSpacing:"0.04em",textTransform:"uppercase"});

  return (
    <div style={{padding:mobile?"6px 0 10px 26px":"8px 0 14px 124px",display:"flex",flexWrap:"wrap",gap:mobile?"6px":"10px",alignItems:"center"}} onClick={e=>e.stopPropagation()}>
      {t.source_url && (
        <a className="link-icon" href={t.source_url} target="_blank" rel="noopener noreferrer"
          style={{fontFamily:F,fontWeight:700,fontSize:"16px",color:srcColor,textDecoration:"none",
            padding:"4px 10px",background:"rgba(0,0,0,0.3)",transition:"all 0.12s",letterSpacing:"0.04em",textTransform:"uppercase"}}>
          {(t.source||"SOURCE").toUpperCase()}
        </a>
      )}
      <span className="r" style={{fontFamily:F,fontWeight:700,fontSize:"16px",color:C.soft,letterSpacing:"0.08em",textTransform:"uppercase",marginRight:"4px"}}>
        BUY / LISTEN:
      </span>

      {checking && (
        <span className="r" style={{fontFamily:F,fontWeight:600,fontSize:"15px",color:C.ghost,letterSpacing:"0.06em",textTransform:"uppercase"}}>
          <span className="loading-dot">·</span><span className="loading-dot"> ·</span><span className="loading-dot"> ·</span> CHECKING...
        </span>
      )}

      {!checking && buyLinks.length === 0 && listenLinks.length === 0 && (
        <span className="r" style={{fontFamily:F,fontWeight:600,fontSize:"15px",color:C.ghost,letterSpacing:"0.06em",textTransform:"uppercase"}}>
          Keine Shops gefunden
        </span>
      )}

      {!checking && buyLinks.map(s => (
        <a key={s.name} className="link-icon" href={s.url} target="_blank" rel="noopener noreferrer" style={linkStyle(s)}>
          {s.name}
        </a>
      ))}

      {!checking && buyLinks.length > 0 && listenLinks.length > 0 && (
        <span style={{color:"rgba(255,255,255,0.15)",margin:"0 2px"}}>|</span>
      )}

      {!checking && listenLinks.map(s => (
        <a key={s.name} className="link-icon" href={s.url} target="_blank" rel="noopener noreferrer" style={linkStyle(s)}>
          {s.name}
        </a>
      ))}

      {!checking && t.label && (
        <>
          <span style={{color:"rgba(255,255,255,0.15)",margin:"0 2px"}}>|</span>
          <a className="link-icon" href={`https://www.google.com/search?q=${encodeURIComponent(t.label+' record label shop buy')}`} target="_blank" rel="noopener noreferrer"
            style={{fontFamily:F,fontWeight:700,fontSize:"16px",color:"rgba(255,255,255,0.5)",textDecoration:"none",
              padding:"4px 10px",background:"rgba(0,0,0,0.2)",transition:"all 0.12s",letterSpacing:"0.04em",textTransform:"uppercase"}}>
            {t.label} Shop
          </a>
        </>
      )}

      {!checking && proxyOk === false && (
        <span className="r" style={{fontFamily:F,fontWeight:500,fontSize:"13px",color:"rgba(255,255,255,0.25)",marginLeft:"4px"}}>
          (proxy offline — alle Links angezeigt)
        </span>
      )}

      {/* SOURCE + FORMAT — moved here from main row */}
      <span style={{marginLeft:"auto",display:"flex",gap:"8px",alignItems:"center"}}>
        <span className="r" style={{fontFamily:F,fontWeight:600,fontSize:"14px",color:srcColor,letterSpacing:"0.06em",textTransform:"uppercase"}}
          title={`Quelle: ${t.source || "?"}`}>
          {(t.source||"—").toUpperCase()}
        </span>
        {fmtLabel && <span className="r" style={{fontFamily:F,fontWeight:700,fontSize:"14px",color:"rgba(255,255,255,0.4)",letterSpacing:"0.04em"}}>{fmtLabel}</span>}
        {t.date && <span className="r" style={{fontFamily:F,fontWeight:500,fontSize:"14px",color:C.ghost,letterSpacing:"0.04em"}}>{t.date}</span>}
      </span>
    </div>
  );
}

  const [myGenres, setMyGenres] = useState(() => {

        const s = store.get("v-my-genres");
        return s && s.length ? s : DEFAULT_MY_GENRES;

      return DEFAULT_MY_GENRES;

      let cloudFav = null;
      try {
        const cloudResp = await fetch('/api/favorites?t=' + Date.now(), { cache: "no-store" });
        if (cloudResp.ok) {
          const cloudData = await cloudResp.json();
          if (Array.isArray(cloudData?.favorites)) cloudFav = cloudData.favorites;
        }
      } catch {}
      let staticFav = [];
      try {
        const favResp = await fetch('./favorites.json?t=' + Date.now());
        if (favResp.ok) {
          const favData = await favResp.json();
          staticFav = favData.map(f => typeof f === 'string' ? f : f.id).filter(Boolean);
        }
      } catch {}
      // Union aller bekannten Quellen — robust gegen jeden Single-Point-of-Failure
      const merged = Array.from(new Set([...savedFav, ...(cloudFav || []), ...staticFav]));
      if (merged.length > 0) {
        setFavIds(new Set(merged));
        store.set("v-fav-radar", merged);
        // last-saved = Cloud wenn vorhanden, sonst Static (= serverseitig bekannter Stand)
        const baseline = cloudFav || staticFav;
        store.set("v-fav-last-saved", baseline);
      }
      const savedHid = store.get("v-hidden-radar");
      if (savedHid) setHiddenIds(new Set(savedHid));

      const data = await fetchReleases();
      if (data) {
        setReleases(data);
        setDataSource("live");
        const genres = [...new Set(data.map(r => r.genre).filter(Boolean))].sort();
        setAllGenres(["All", ...genres]);
        const sources = [...new Set(data.map(r => (r.source||"discogs")).filter(Boolean))].sort();
        setAllSources(["All", ...sources]);
      } else {
        setReleases(MOCK);
        setAllGenres(["All","Minimal House","Microhouse","Rominimal","Dub Techno","Deep House"]);
        setDataSource("mock");
      }
      setLoading(false);
    })();
  }, [fetchReleases]);

  // Polling: refresh every 30s
  useEffect(() => {
    const iv = setInterval(async () => {
      const data = await fetchReleases();
      if (data && dataChanged(data)) {
        setReleases(data);
        setDataSource("live");
        const genres = [...new Set(data.map(r => r.genre).filter(Boolean))].sort();
        setAllGenres(["All", ...genres]);
        const sources = [...new Set(data.map(r => (r.source||"discogs")).filter(Boolean))].sort();
        setAllSources(["All", ...sources]);
      }
    }, 30000);
    return () => clearInterval(iv);
  }, [fetchReleases, dataChanged]);

  const save = useCallback(ids => { store.set("v-heard-radar", [...ids]); }, []);
  const toggle = useCallback(id => {
    setHeardIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); save(n); return n; });
  }, [save]);
  const saveFav = useCallback(ids => { store.set("v-fav-radar", [...ids]); }, []);
  const toggleFav = useCallback(id => {
    setFavIds(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); saveFav(n); return n; });
  }, [saveFav]);

  // Auto-Cloud-Sync (debounced 2s nach letzter Aenderung) — POST an /api/favorites
  // Beim Erfolg wird "last-saved" angepasst, sodass der unsaved-Counter zurueck auf 0 geht.
  const [cloudSyncStatus, setCloudSyncStatus] = useState("idle"); // idle | syncing | ok | err
  useEffect(() => {
    const t = setTimeout(async () => {
      // Skip on initial load before favIds is hydrated
      if (favIds.size === 0 && (store.get("v-fav-radar") || []).length === 0) return;
      try {
        setCloudSyncStatus("syncing");
        const resp = await fetch('/api/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ favorites: [...favIds] }),
        });
        if (resp.ok) {
          setCloudSyncStatus("ok");
          store.set("v-fav-last-saved", [...favIds]);
          setLastSavedFavs(new Set(favIds));
        } else {
          setCloudSyncStatus("err");
        }
      } catch {
        setCloudSyncStatus("err");
      }
    }, 2000);
    return () => clearTimeout(t);
  }, [favIds]);
  const [ytLoading, setYtLoading] = useState(false);
  const searchYouTube = useCallback(async (query) => {
    const instances = ['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.yt'];
    for (const base of instances) {
      try {
        const resp = await fetch(`${base}/search?q=${encodeURIComponent(query)}&filter=videos`);
        if (resp.ok) {
          const data = await resp.json();
          const items = data.items || data;
          if (items && items.length > 0) {
            const url = items[0].url || '';
            const match = url.match(/[?&]v=([^&]+)/) || url.match(/\/([^/]+)$/);
            if (match) return match[1];
          }
        }
      } catch {}
    }
    return null;
  }, []);
  const openYtPlaylist = useCallback(async () => {
    const favReleases = releases.filter(r => favIds.has(r.id));
    if (favReleases.length === 0) return;
    setYtLoading(true);
    const videoIds = [];
    for (const r of favReleases) {
      const id = await searchYouTube(`${r.artist} ${r.title}`);
      if (id) videoIds.push(id);
    }
    setYtLoading(false);
    if (videoIds.length > 0) {
      window.open(`https://www.youtube.com/watch_videos?video_ids=${videoIds.join(',')}`, '_blank');
    } else {
      // Fallback: open first favorite as YouTube search
      const q = encodeURIComponent(`${favReleases[0].artist} ${favReleases[0].title}`);
      window.open(`https://www.youtube.com/results?search_query=${q}`, '_blank');
    }
  }, [releases, favIds, searchYouTube]);
  const saveFavToFile = useCallback(() => {

    const data = favReleases.map(r => ({id:r.id, artist:r.artist, title:r.title, label:r.label, date:r.date, source:r.source, quality_score:r.quality_score}));
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'favorites.json'; a.click();
    URL.revokeObjectURL(url);
    // Mark current state as saved → unsaved-Counter geht auf 0
    store.set("v-fav-last-saved", [...favIds]);
    setLastSavedFavs(new Set(favIds));

  // Track unsaved changes (compared to last download or initial server-state)

  useEffect(() => {

    .filter(r => {

      if (tagTokens.length === 0) return true;
      const haystack = [(r.genre||"").toLowerCase(), ...(r.styles||[]).map(s => s.toLowerCase())];

        <div style={{position:"absolute",width:"130vw",height:"20vh",top:"50%",left:"-15%",background:"linear-gradient(92deg,transparent 8%,#e8609888 18%,#d8508866 35%,transparent 70%)",filter:"blur(20px)",transform:"rotate(-2deg)"}}/>
        <div style={{position:"absolute",width:"45vw",height:"35vw",top:"65%",left:"0%",background:`radial-gradient(circle,${C.orange}99 0%,transparent 65%)`,filter:"blur(18px)",borderRadius:"45% 55% 50% 50%/55% 45% 55% 45%"}}/>
        <div style={{position:"absolute",width:"25vw",height:"25vw",top:"68%",right:"12%",background:"radial-gradient(circle,rgba(50,25,40,0.55) 0%,transparent 65%)",filter:"blur(15px)",borderRadius:"50% 40% 60% 40%"}}/>
        <div style={{position:"absolute",width:"18vw",height:"22vw",top:"3%",right:"3%",background:"radial-gradient(circle,rgba(40,20,30,0.45) 0%,transparent 55%)",filter:"blur(12px)"}}/>
        {[{t:"20%",r:"8%",s:"8vw",o:0.5},{t:"25%",r:"12%",s:"5vw",o:0.4},{t:"22%",r:"5%",s:"6vw",o:0.35}].map((d,i) =>
          <div key={i} style={{position:"absolute",width:d.s,height:d.s,top:d.t,right:d.r,background:`radial-gradient(circle,rgba(255,210,225,${d.o}) 0%,transparent 60%)`,filter:`blur(${3+i}px)`,borderRadius:"50%"}}/>
        )}
        <div className="rg" style={{position:"absolute",inset:0,backgroundImage:`url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.14'/%3E%3C/svg%3E")`,backgroundRepeat:"repeat",backgroundSize:"256px",mixBlendMode:"multiply"}}/>
        <div style={{position:"absolute",inset:0,backgroundImage:`url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='turbulence' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.1'/%3E%3C/svg%3E")`,backgroundRepeat:"repeat",backgroundSize:"128px",mixBlendMode:"overlay"}}/>
      </div>

      {/* CONTENT */}

          {dataSource === "mock" && !loading && (

              {/* ALL button */}

            <span className="sort-link" onClick={() => setShowHidden(!showHidden)} style={{cursor:"pointer",transition:"color 0.1s"}}>{showHidden?"HIDE ⊘":"SHOW ⊘"}</span>
            <span className="sort-link" onClick={() => {const a=new Set(filtered.map(r=>r.id));setHeardIds(p=>{const n=new Set([...p,...a]);save(n);return n})}} style={{cursor:"pointer",transition:"color 0.1s"}}>✓ ALL</span>
            {favCount > 0 && <span className="sort-link" onClick={ytLoading?undefined:openYtPlaylist} style={{cursor:ytLoading?"wait":"pointer",transition:"color 0.1s",color:ytLoading?"rgba(255,80,80,0.4)":"rgba(255,80,80,0.9)"}} title="Alle Favoriten als YouTube-Playlist öffnen">{ytLoading?`⏳ ${favCount} Videos...`:`▶ YT PLAYLIST`}</span>}
            {favCount > 0 && <span className="sort-link" onClick={saveFavToFile} style={{cursor:"pointer",transition:"color 0.1s",color:unsavedFavCount > 0 ? "rgba(255,200,80,0.9)" : C.ghost,fontSize:"0.85em",fontWeight:unsavedFavCount > 0 ? 600 : 400}} title={unsavedFavCount > 0 ? `${unsavedFavCount} ungesicherte Aenderungen — JSON-Backup erstellen` : "Favoriten als JSON sichern"}>{unsavedFavCount > 0 ? `SAVE (${unsavedFavCount}!)` : "SAVE"}</span>}
            {favCount > 0 && <span style={{fontSize:"0.75em",color:cloudSyncStatus === "ok" ? "rgba(110,207,138,0.7)" : cloudSyncStatus === "syncing" ? "rgba(255,200,80,0.7)" : cloudSyncStatus === "err" ? "rgba(255,100,100,0.7)" : C.ghost,marginLeft:"4px"}} title={cloudSyncStatus === "ok" ? "Auto-Sync zu Cloud aktiv" : cloudSyncStatus === "syncing" ? "Synchronisiere zur Cloud..." : cloudSyncStatus === "err" ? "Cloud-Sync fehlgeschlagen — localStorage als Fallback" : "Cloud-Sync bereit"}>{cloudSyncStatus === "ok" ? "☁︎" : cloudSyncStatus === "syncing" ? "↻" : cloudSyncStatus === "err" ? "⚠" : "·"}</span>}
            {allSources.length > 2 && (<>
              <span style={{color:C.ghost}}>|</span>
              {allSources.map(s => {
                const SC2 = {"all":"#fff","discogs":"rgba(255,180,60,0.9)","beatport":"rgba(148,232,116,0.95)","bandcamp":"rgba(99,210,218,0.95)","spotify":"rgba(30,215,96,0.9)"};
                const c = SC2[s.toLowerCase()] || C.soft;
                return <span key={s} className="sort-link" onClick={() => setSourceFilter(s)}
                  style={{cursor:"pointer",color:sourceFilter===s?c:C.soft,borderBottom:sourceFilter===s?`1px solid ${c}`:"none",paddingBottom:"1px",transition:"color 0.1s"}}>
                  {s.toUpperCase()}
                </span>;
              })}
            </>)}
            <span style={{color:C.ghost}}>|</span>
            {[["New","#fff"],["All","#888"],["Verified","#6ecf8a"],["Shop","#d4c05e"],["Restock","#999"]].map(([label,color]) =>
              <span key={label} className="sort-link" onClick={() => setFreshnessFilter(label)}
                style={{cursor:"pointer",color:freshnessFilter===label?color:C.soft,borderBottom:freshnessFilter===label?`1px solid ${color}`:"none",paddingBottom:"1px",transition:"color 0.1s",fontSize:mobile?"11px":"inherit"}}>
                {label.toUpperCase()}
              </span>
            )}
          </div>

          {/* PROGRESS — indented */}
          <div style={{height:"5px",marginBottom:"8px",background:"rgba(255,255,255,0.08)",marginLeft:mobile?0:"60px"}}>
            <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${C.orange},${C.mauve})`,transition:"width 0.5s"}}/>
          </div>
          <div className="r" style={{fontFamily:F,fontWeight:700,fontSize:mobile?"14px":"18px",color:C.soft,letterSpacing:"0.06em",textTransform:"uppercase",display:"flex",justifyContent:"space-between",marginBottom:"14px",marginLeft:mobile?0:"60px"}}>
            <span>{filtered.length} RELEASES</span>
            <span>{favCount > 0 && `★ ${favCount}`}</span>
            <span>{heardCount} HEARD ({pct}%)</span>
            <span>{releases.length - heardCount} LEFT</span>
          </div>

          {/* TRACKS */}
          <div>
            {filtered.length === 0 ? (
              <div className="rb" style={{fontFamily:F,fontWeight:800,fontSize:"30px",color:C.soft,textTransform:"uppercase",textAlign:"center",padding:"60px 0",textShadow:"2px 1px 0 rgba(180,80,110,0.2)"}}>
                {search ? "NO MATCHES" : "ALL CAUGHT UP"}
              </div>
            ) : (
              filtered.map(t => <Row key={t.id} t={t} heard={heardIds.has(t.id)} toggle={toggle}
                fav={favIds.has(t.id)} toggleFav={toggleFav}
                hidden={hiddenIds.has(t.id)} toggleHide={toggleHide}
                expanded={expandedIds.has(t.id)} toggleExpand={toggleExpand}
                playing={playingId === t.id} togglePlay={togglePlay}
                mobile={mobile}/>)
            )}
          </div>

          {/* FOOTER */}
          <div className="r" style={{padding:mobile?"20px 0 32px":"32px 0 48px",textAlign:"center",fontFamily:F,fontWeight:600,fontSize:mobile?"14px":"20px",color:C.ghost,letterSpacing:"0.2em",textTransform:"uppercase",marginLeft:mobile?0:"60px"}}>
            VALENTINA · {releases.length} TRACKS · {[...new Set(releases.map(r=>(r.source||"discogs").toUpperCase()))].join(" + ")} · YT / BC / BP / SC / SP
          </div>
        </>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
